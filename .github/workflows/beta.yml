name: Update Beta installer

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-installer
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/beta' && vars.PACKWIZ_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.6'
          cache: false
      - name: Install pinned Packwiz
        run: go install github.com/packwiz/packwiz@ef87d964f8cbd52b3b13ea42453ef322290e2b9e
      - name: Test release safeguards
        run: python3 -m unittest discover -s distribution/tests -v
      - name: Validate, build and refresh Beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 distribution/release.py beta
