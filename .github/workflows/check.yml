name: Check pack and release tooling

on:
  push:
    branches: [public, main, beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.6'
          cache: false
      - name: Install pinned Packwiz
        run: go install github.com/packwiz/packwiz@ef87d964f8cbd52b3b13ea42453ef322290e2b9e
      - name: Check index is current
        working-directory: pack
        run: |
          packwiz refresh
          git diff --exit-code -- .
      - name: Validate pack and test release safeguards
        run: |
          python distribution/release.py validate
          python -m unittest discover -s distribution/tests -v
      - name: Build and inspect rolling and fixed imports without historical tags
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'distribution')
          import release
          sha = release.git('rev-parse', 'HEAD')
          for selection in ('public', 'beta', 'v' + release.validate()['version']):
              release.build(Path('dist/check').resolve(), selection, sha)
          PY
